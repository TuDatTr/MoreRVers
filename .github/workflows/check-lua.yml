name: Check Lua

on: [push, pull_request]

permissions:
  contents: read

jobs:
  session-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4
      - name: Check syntax
        run: |
          luac5.4 -p Mods/MoreRVers/scripts/main.lua
          luac5.4 -p tools/ue4ss_stub_test.lua
          luac5.4 -p tools/session_test.lua
      - name: Smoke test
        run: lua5.4 tools/ue4ss_stub_test.lua
      - name: Session lifecycle test
        run: lua5.4 tools/session_test.lua
